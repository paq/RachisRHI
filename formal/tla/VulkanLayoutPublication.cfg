\* Bounds: 2 commands, 2 subresource cells, layouts 0..2.
\* Expect: pass
\* Checks deferred layout staging, clean reset/discard rollback, selective per-subresource commit on submit,
\* and that every submitted barrier on a tracked cell starts from the cell's layout, with no refusal of a correct one.
CONSTANTS
  DeferPublishToSubmit = TRUE
  SelectiveCommit = TRUE
  CheckBeforeLayouts = TRUE
  SkipUnknownEntry = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Safety
PROPERTY StepSafety
CHECK_DEADLOCK FALSE
