\* Bounds: 2 commands, 2 subresource cells, layouts 0..2, CheckBeforeLayouts = FALSE.
\* Expect: invariant NoMisusedBarrierSubmitted
\* Counterexample: trusting the caller's before-layout submits a barrier that starts from a layout the subresource is not in.
CONSTANTS
  DeferPublishToSubmit = TRUE
  SelectiveCommit = TRUE
  CheckBeforeLayouts = FALSE
  SkipUnknownEntry = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoMisusedBarrierSubmitted
INVARIANT Safety
PROPERTY StepSafety
CHECK_DEADLOCK FALSE
