\* Bounds: 2 commands, 2 subresource cells, layouts 0..2, SelectiveCommit = FALSE.
\* Expect: invariant CommittedMatchesAcceptedReplay
\* Counterexample: committing an entire record-time layout snapshot clobbers subresources committed by an intervening submission.
CONSTANTS
  DeferPublishToSubmit = TRUE
  SelectiveCommit = FALSE
  CheckBeforeLayouts = TRUE
  SkipUnknownEntry = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT CommittedMatchesAcceptedReplay
INVARIANT Safety
CHECK_DEADLOCK FALSE
