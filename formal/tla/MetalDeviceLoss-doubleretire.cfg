\* Bounds: up to 2 submissions, synthetic and native loss paths.
\* Expect: invariant RetirementMatchesSubmissions
\* RetireOncePerSubmission off: a completed submission slot is retired a second time, corrupting pending accounting.
CONSTANTS
    MaxSubmissions = 2
    DrainSyntheticLoss = TRUE
    RetireOncePerSubmission = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT RetirementMatchesSubmissions
INVARIANT Safety
PROPERTY StepSafety
CHECK_DEADLOCK FALSE
