\* Bounds: 3 queue gates (0..2), 3 per-queue submitters, 2 concurrent device-idle actors with AllOrNothingIdle = FALSE, OrderedProbes = TRUE.
\* Expect: invariant IdleActorNeverWaitsHoldingSubset
\* AllOrNothingIdle off: even ascending sequential blocking locks wait while holding a subset of queue gates, violating the all-or-nothing acquisition waitIdle() gets from the standard libraries' try-and-back-off std::scoped_lock.
CONSTANTS
    AllOrNothingIdle = FALSE
    OrderedProbes = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT IdleActorNeverWaitsHoldingSubset
INVARIANT Safety
CHECK_DEADLOCK FALSE
