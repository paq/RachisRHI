\* Bounds: 2 objects, 2 consumers, 2 lazy capacity-2 descriptor pools (4 slots).
\* Expect: invariant ConsumersRetainUnaliasedDescriptors
\* Counterexample: freeing a descriptor slot on logical destroy while a consumer still retains the lease breaks consumer retention.
CONSTANT DeferFreeUntilConsumersRelease = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ConsumersRetainUnaliasedDescriptors
INVARIANT Safety
PROPERTY StepSafety
CHECK_DEADLOCK FALSE
